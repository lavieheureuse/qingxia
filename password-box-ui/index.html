<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>密码盒</title>
  <link rel="stylesheet" href="style.css">
  <script defer src="app.js"></script>
</head>
<body>
  <header class="top"><div class="brand"><span class="brand-icon"><img src="logo.png" alt=""></span><strong>密码盒</strong></div><input id="search" type="search" placeholder="搜索名称、账号、备注等" aria-label="搜索密码"></header>
  <main>
    <div class="toolbar"><button class="primary" id="add">＋ 添加密码</button><div class="tools"><div class="group-filter" id="group"><button type="button" id="group-toggle" aria-label="筛选分组" aria-expanded="false" aria-controls="group-options"><span id="group-label">全部分组</span><span class="chevron" aria-hidden="true"></span></button><div id="group-options" class="group-options" hidden></div></div><button id="import">导入</button><button id="export">导出</button><button id="about">关于</button></div></div>
    <div class="table-wrap"><table><thead><tr><th class="number">#</th><th>名称</th><th>密码</th><th>所属分组</th><th>操作</th></tr></thead><tbody id="rows"></tbody></table><div id="empty" class="empty" hidden><div class="empty-icon" aria-hidden="true">⌕</div><strong id="empty-title"></strong><p id="empty-description"></p><button type="button" class="empty-action" id="empty-add">添加第一条密码</button></div></div>
    <p class="notice"><span class="notice-dot" aria-hidden="true"></span>密码已加密保存在本机</p>
  </main>
  <dialog id="editor"><form id="form"><div class="dialog-head"><div><h2 id="form-title">添加密码</h2><p>填写账号信息，方便快速查找。</p></div><button type="button" class="close" id="close" aria-label="关闭">×</button></div><div class="fields"><label><span>名称 <em>*</em></span><input name="name" maxlength="100" required placeholder="例如：工作邮箱"></label><label>账号<input name="account" maxlength="100" placeholder="输入账号"></label><label><span>密码 <em>*</em></span><div class="password-input"><input name="password" type="password" maxlength="2048" required placeholder="输入密码"><button type="button" id="toggle-password">显示</button><button type="button" id="generate">生成</button></div></label><div class="edit-group"><label for="edit-group-input">所属分组</label><div class="edit-group-input"><input id="edit-group-input" name="group" maxlength="50" placeholder="输入新分组，或选择已有分组" aria-controls="edit-group-options"><button type="button" id="edit-group-toggle" aria-expanded="false" aria-controls="edit-group-options">选择</button></div><div id="edit-group-options" class="edit-group-options" hidden></div><small>输入新名称并保存，即可创建分组</small></div><label>所属应用<input name="application" maxlength="250" placeholder="网站或应用名称"></label><label>备注说明<textarea name="note" maxlength="5000" rows="3" placeholder="添加备注"></textarea></label><label class="favorite"><input name="favorite" type="checkbox"> 加入收藏</label></div><div class="dialog-actions"><p id="form-error" class="error form-error" role="alert"></p><button type="button" id="cancel">取消</button><button class="primary" type="submit">保存</button></div></form></dialog>
  <dialog id="export-dialog" aria-labelledby="export-title" aria-describedby="export-description"><div class="dialog-head"><div><h2 id="export-title">导出密码</h2><p>将密码备份为 JSON 文件</p></div><button type="button" class="close" id="export-close" aria-label="关闭">×</button></div><div class="export-content"><div class="export-warning"><strong>请妥善保管导出文件</strong><p id="export-description">JSON 文件包含明文账号和密码。导出后，请保存在安全的位置。</p></div><p class="export-count" id="export-count"></p></div><div class="dialog-actions"><button type="button" id="export-cancel">取消</button><button type="button" class="primary" id="export-confirm">选择导出位置</button></div></dialog>
  <dialog id="confirm-dialog" aria-labelledby="confirm-title" aria-describedby="confirm-description"><div class="dialog-head"><div><h2 id="confirm-title"></h2><p id="confirm-subtitle"></p></div><button type="button" class="close" id="confirm-close" aria-label="关闭">×</button></div><div class="confirm-content"><p id="confirm-description"></p></div><div class="dialog-actions"><button type="button" id="confirm-cancel">取消</button><button type="button" class="primary" id="confirm-accept"></button></div></dialog>
  <dialog id="unlock"><form id="unlock-form"><div class="dialog-head"><div><h2 id="unlock-title">解锁密码盒</h2><p id="unlock-hint"></p></div></div><div class="fields"><label>主密码<input name="master" type="password" minlength="8" required autocomplete="current-password" placeholder="至少 8 个字符"></label><label id="confirm-label">再次输入主密码<input name="confirmation" type="password" autocomplete="new-password" placeholder="再次输入主密码"></label><p id="unlock-error" class="error" role="alert"></p></div><div class="dialog-actions"><button type="button" id="skip-password">不设置主密码</button><button class="primary" type="submit" id="unlock-button">解锁</button></div></form></dialog>
  <div id="toast" role="status"></div>
</body>
</html>
