<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self'">
  <title>Hosts 快速编辑</title>
  <link rel="stylesheet" href="style.css">
  <script src="app.js" defer></script>
</head>
<body>
  <div class="layout">
    <aside><div class="brand"><img src="logo.png" alt=""> <span>Hosts 管理</span></div><nav aria-label="配置选择">
      <button data-view="current" class="selected"><img src="assets/file-text.svg" alt="">当前文件</button>
      <button data-view="dev"><img src="assets/code-xml.svg" alt="">开发环境</button>
      <button data-view="test"><img src="assets/flask-conical.svg" alt="">测试环境</button>
      <button data-view="prod"><img src="assets/layers.svg" alt="">生产环境</button>
    </nav><img class="forest" src="assets/forest.png" alt="" aria-hidden="true"></aside>
    <main>
      <header><div><h1 id="title">当前文件</h1><p id="hint">查看和编辑系统 Hosts，环境区段外的配置会保留。</p></div><div class="actions"><button id="refresh" type="button">重新读取</button><button id="save" class="primary" type="button">保存当前文件</button><button id="apply" class="primary" type="button" hidden>应用到系统</button></div></header>
      <div class="editor"><textarea id="content" spellcheck="false" aria-label="Hosts 配置内容"></textarea></div>
      <footer><span id="status" role="status" aria-live="polite"></span><span id="dirty"></span></footer>
    </main>
  </div>
</body>
</html>
