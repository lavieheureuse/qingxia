<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'self'; script-src 'self'">
  <title>时间戳转换</title>
  <link rel="stylesheet" href="style.css">
  <script src="app.js" defer></script>
</head>
<body>
  <header><div><p class="eyebrow">TIME CONVERTER</p><h1>时间戳转换</h1><p class="subtitle">日期和时间戳，轻松互转</p></div></header>
  <main>
    <div class="toolbar">
      <div class="setting"><span class="setting-label">时间单位</span><div class="units" role="group" aria-label="时间戳单位">
        <button type="button" data-unit="ns" aria-pressed="false">纳秒</button>
        <button type="button" data-unit="ms" aria-pressed="true">毫秒</button>
        <button type="button" data-unit="s" aria-pressed="false">秒</button>
      </div></div>
      <div class="setting zone-setting"><label class="setting-label" for="zone">时区</label><div class="zone-wrap"><input id="zone" role="combobox" aria-label="选择时区" aria-expanded="false" aria-controls="zone-list" autocomplete="off"><div id="zone-list" role="listbox" hidden></div></div></div>
    </div>
    <section><div class="section-heading"><div><h2>日期转时间戳</h2><p>按<span class="city">北京</span>时间转换</p></div><span class="hint">点击结果复制</span></div><div class="convert"><div class="picker-wrap"><button id="date" class="picker-trigger" type="button" aria-haspopup="dialog" aria-expanded="false" aria-controls="date-picker"><span id="date-label">选择日期和时间</span><span aria-hidden="true">⌄</span></button><div id="date-picker" class="picker" role="dialog" aria-label="选择日期和时间" hidden><div class="picker-header"><button id="prev-month" type="button" aria-label="上个月">‹</button><strong id="month-label"></strong><button id="next-month" type="button" aria-label="下个月">›</button></div><div class="weekdays" aria-hidden="true"><span>一</span><span>二</span><span>三</span><span>四</span><span>五</span><span>六</span><span>日</span></div><div id="calendar" class="calendar"></div><div class="time-row"><span>时间</span><select id="hours" aria-label="小时"></select><span>:</span><select id="minutes" aria-label="分钟"></select><span>:</span><select id="seconds" aria-label="秒"></select></div><div class="picker-actions"><button id="picker-today" type="button">现在</button><button id="picker-cancel" type="button">取消</button><button id="picker-confirm" type="button">确定</button></div></div></div><span class="arrow" aria-hidden="true">→</span><button class="result" id="date-result" type="button" disabled>—</button></div><p id="date-error" class="error" role="status"></p></section>
    <section><div class="section-heading"><div><h2>时间戳转日期</h2><p>显示<span class="city">北京</span>时间</p></div><span class="hint">点击结果复制</span></div><div class="convert"><input id="stamp" type="text" inputmode="numeric" aria-label="时间戳" placeholder="输入时间戳" autocomplete="off"><span class="arrow" aria-hidden="true">→</span><button class="result" id="stamp-result" type="button" disabled>—</button></div><p id="stamp-error" class="error" role="status"></p></section>
    <section class="current"><div><p class="current-label">当前时间戳 <span id="unit-name">毫秒</span></p><button id="now" class="now" type="button" title="点击复制"></button><p class="copy-hint">点击数字复制</p></div><button id="pause" type="button">暂停</button></section>
  </main>
  <div id="toast" role="status" aria-live="polite" hidden></div>
</body>
</html>
